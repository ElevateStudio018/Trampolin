<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Not found · Trampolin</title>
    <script>
      // The demo uses hash routes; send unknown paths to the app root.
      location.replace(location.pathname.split("/").slice(0, 2).join("/") + "/#/");
    </script>
  </head>
  <body><p>Page not found. <a href="./">Go to Trampolin</a>.</p></body>
</html>
