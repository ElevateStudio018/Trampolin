name: Static demo (GitHub Pages)

on:
  push:
    branches: [claude/trampoline-trick-platform-hy797n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trampolin
          POSTGRES_PASSWORD: trampolin
          POSTGRES_DB: trampolin_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trampolin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://trampolin:trampolin@localhost:5432/trampolin_demo
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Export the published Trick Book from a freshly migrated and seeded database.
      - run: npx tsx scripts/migrate.ts
      - run: npx tsx scripts/seed.ts
      - run: npx tsx scripts/build-static-demo.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
